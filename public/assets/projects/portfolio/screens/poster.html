<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0; padding: 0;
            width: 1920px; height: 1080px;
            overflow: hidden;
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
        }
        .isometric-container {
            perspective: 2500px;
            transform-style: preserve-3d;
            position: absolute;
            right: -200px;
            top: 50px;
        }
        .mockup {
            width: 1000px;
            border-radius: 12px;
            box-shadow: -40px 50px 80px rgba(0,0,0,0.6);
            /* This is the magic isometric 3D transform */
            transform: rotateX(25deg) rotateY(-30deg) rotateZ(15deg);
            position: absolute;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .mac-header {
            background: #1e293b;
            height: 36px;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            display: flex;
            align-items: center;
            padding-left: 15px;
            gap: 8px;
        }
        .mac-btn { width: 12px; height: 12px; border-radius: 50%; }
        .btn-r { background: #ef4444; }
        .btn-y { background: #eab308; }
        .btn-g { background: #22c55e; }
        .mockup img { 
            width: 100%; 
            height: 600px;
            object-fit: cover;
            object-position: top;
            border-bottom-left-radius: 12px; 
            border-bottom-right-radius: 12px; 
            display: block; 
        }
        
        /* Cascading layers */
        .mockup-1 { top: 0px; right: 0px; z-index: 1; opacity: 0.6; filter: blur(2px); }
        .mockup-2 { top: 180px; right: 280px; z-index: 2; opacity: 0.9; }
        .mockup-3 { top: 360px; right: 560px; z-index: 3; box-shadow: -50px 60px 100px rgba(0,0,0,0.8); }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
        }
    </style>
</head>
<body class="relative text-white flex items-center">

    <!-- Glowing orbs in background -->
    <div class="absolute w-[800px] h-[800px] bg-blue-600 rounded-full blur-[150px] opacity-20 -top-40 -left-40"></div>
    <div class="absolute w-[600px] h-[600px] bg-teal-500 rounded-full blur-[150px] opacity-10 bottom-0 left-1/3"></div>

    <div class="ml-24 z-10 w-[750px]">
        <div class="glass-card p-14 shadow-2xl">
            <h2 class="text-teal-400 font-bold tracking-[0.3em] uppercase mb-4 text-xl">Official Portfolio</h2>
            <h1 class="text-7xl font-black leading-tight mb-6 tracking-tight">
                SEIF<br>ELMUSELMANI
            </h1>
            <p class="text-2xl text-slate-300 font-light leading-relaxed mb-10">
                System Architect & Backend Software Engineer. Delivering high-performance, scalable web solutions.
            </p>
            <div class="flex gap-4">
                <span class="px-6 py-2 bg-slate-800/50 rounded-full text-sm font-semibold border border-slate-700 text-slate-200">.NET 8</span>
                <span class="px-6 py-2 bg-slate-800/50 rounded-full text-sm font-semibold border border-slate-700 text-slate-200">React</span>
                <span class="px-6 py-2 bg-slate-800/50 rounded-full text-sm font-semibold border border-slate-700 text-slate-200">Clean Architecture</span>
            </div>
        </div>
    </div>

    <!-- 3D Isometric Mockups -->
    <div class="isometric-container">
        <div class="mockup mockup-1">
            <div class="mac-header"><div class="mac-btn btn-r"></div><div class="mac-btn btn-y"></div><div class="mac-btn btn-g"></div></div>
            <img src="file:///F:/My-project/mine/personal-portfolio/public/assets/projects/portfolio/screens/3_about.png" alt="About">
        </div>
        
        <div class="mockup mockup-2">
            <div class="mac-header"><div class="mac-btn btn-r"></div><div class="mac-btn btn-y"></div><div class="mac-btn btn-g"></div></div>
            <img src="file:///F:/My-project/mine/personal-portfolio/public/assets/projects/portfolio/screens/2_projects.png" alt="Projects">
        </div>
        
        <div class="mockup mockup-3">
            <div class="mac-header"><div class="mac-btn btn-r"></div><div class="mac-btn btn-y"></div><div class="mac-btn btn-g"></div></div>
            <img src="file:///F:/My-project/mine/personal-portfolio/public/assets/projects/portfolio/screens/1_home.png" alt="Home">
        </div>
    </div>

</body>
</html>
